<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CASH-NET PRO</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f172a;color:#fff;padding:12px}.header{display:flex;align-items:center;gap:10px;justify-content:center;padding:12px}.logo{width:55px;height:55px;background:#22c55e;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}#daysLeft{background:#fef3c7;color:#92400e;padding:8px;border-radius:10px;text-align:center;font-weight:bold;margin:8px 0}.card{background:#1e293b;padding:18px;border-radius:14px;margin:10px 0}.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin:6px 0;cursor:pointer}.btn-green{background:#22c55e;color:#fff}.btn-gold{background:#f59e0b;color:#fff}.btn-dark{background:#334155;color:#fff}#timer{font-size:30px;color:#f59e0b;text-align:center;font-weight:bold}.q{font-size:17px;margin:12px 0;font-weight:bold}.ans{background:#334155;padding:11px;border-radius:10px;margin:7px 0;cursor:pointer}#nextBtn{display:none}.lead-row{display:flex;justify-content:space-between;background:#334155;padding:9px;border-radius:8px;margin:5px 0;font-size:14px}input{width:100%;padding:12px;border-radius:10px;color:#000;margin:8px 0;border:none}</style></head><body>
<div class="header"><div class="logo" id="logoTap">💰</div><h1>CASH-NET</h1></div><div id="daysLeft">Login to see expiry</div>
<div class="card" id="loginBox"><h3>Login</h3><input id="phoneInput" placeholder="099xxxxxxx"><button class="btn btn-green" onclick="login()">LOGIN</button><a href="https://whatsapp.com/channel/0029Vb6EgsV1CY9INbJ5X01q" target="_blank" style="color:#22c55e;display:block;text-align:center;margin-top:10px;text-decoration:none">📢 Follow Channel to Unlock</a></div>
<div class="card" id="payBox" style="display:none"><h3 style="color:#f59e0b">🔒 Not Active / Expired (3 Days Over)</h3><p style="margin:10px 0">Send <b>MK500</b> to<br><b style="color:#22c55e;font-size:20px">0996504676</b> Airtel<br>Gift Mkandawire</p><p style="font-size:14px">1. Send MK500<br>2. WhatsApp screenshot 0885801081<br>3. Admin activates 3 days</p><button class="btn btn-gold" onclick="alert('WhatsApp 0885801081')">I PAID</button><button class="btn btn-dark" onclick="location.reload()">Check Activation</button></div>
<div class="card" id="quizBox" style="display:none"><div id="timer">10s</div><div class="q" id="qText"></div><div id="answers"></div><button id="nextBtn" class="btn btn-green" onclick="nextQuestion()">NEXT ➡️</button><p style="margin-top:10px;text-align:center">Pts:<span id="pts">0</span> | MK<span id="cash">0</span> | Q<span id="qNum">1</span>/100</p></div>
<div class="card"><h3>🏆 LIVE Leaderboard</h3><div id="leaderboardList"></div></div>
<div class="card" id="adminBox" style="display:none"><h3>🔑 Admin</h3><input id="adminPhone" placeholder="Phone"><button class="btn btn-green" onclick="adminActivate()">ACTIVATE 3 DAYS</button><button class="btn btn-dark" onclick="adminDeactivate()">DEACTIVATE</button><div id="allUsers" style="margin-top:10px;font-size:12px"></div></div>
<script>
let questions=[{q:"Capital Malawi?",a:["Lilongwe","Blantyre","Mzuzu"],correct:0},{q:"2+2?",a:["3","4","5"],correct:1},{q:"Currency Malawi?",a:["Kwacha","Dollar","Rand"],correct:0},{q:"Largest lake?",a:["Lake Malawi","Chilwa","Malombe"],correct:0},{q:"5x6?",a:["30","25","35"],correct:0},{q:"Malawi districts?",a:["28","30","25"],correct:0},{q:"10-3?",a:["7","6","8"],correct:0},{q:"President 2024?",a:["Chakwera","Mutharika","Banda"],correct:0},{q:"Airtel code?",a:["*211#","*244#","*131#"],correct:0},{q:"100/10?",a:["10","9","11"],correct:0},{q:"Fastest animal?",a:["Cheetah","Lion","Dog"],correct:0},{q:"Water H2O?",a:["H2O","CO2","O2"],correct:0},{q:"Sun rises?",a:["East","West","North"],correct:0},{q:"3 days hours?",a:["72hrs","48hrs","24hrs"],correct:0},{q:"7x8?",a:["56","54","58"],correct:0},{q:"Independence?",a:["1964","1963","1965"],correct:0},{q:"Capital Zambia?",a:["Lusaka","Harare","Maputo"],correct:0},{q:"9x9?",a:["81","72","90"],correct:0},{q:"Largest ocean?",a:["Pacific","Atlantic","Indian"],correct:0},{q:"20+30?",a:["50","40","60"],correct:0},{q:"Phone activation?",a:["0885801081","0996504676","Both"],correct:2},{q:"12/3?",a:["4","3","5"],correct:0},{q:"National park?",a:["Liwonde","Kruger","Serengeti"],correct:0},{q:"15+15?",a:["30","25","35"],correct:0},{q:"Months year?",a:["12","10","11"],correct:0},{q:"MK500 days?",a:["3 days","1 day","7 days"],correct:0},{q:"CPU is?",a:["CPU","RAM","Mouse"],correct:0},{q:"6x6?",a:["36","30","42"],correct:0},{q:"Lake also Nyasa?",a:["Lake Nyasa","Victoria","Tanganyika"],correct:0},{q:"25/5?",a:["5","6","4"],correct:0},{q:"Moon man?",a:["Neil","John","Peter"],correct:0},{q:"Channel needed?",a:["Yes","No","Optional"],correct:0},{q:"8+12?",a:["20","18","22"],correct:0},{q:"Language Malawi?",a:["Chichewa","Zulu","Swahili"],correct:0},{q:"100-50?",a:["50","40","60"],correct:0},{q:"Longest river?",a:["Nile","Zambezi","Shire"],correct:0},{q:"4x9?",a:["36","32","40"],correct:0},{q:"Alphabet?",a:["26","24","28"],correct:0},{q:"Fee CASH-NET?",a:["MK500","MK1000","MK300"],correct:0},{q:"50+50?",a:["100","90","110"],correct:0},{q:"Capital Mozambique?",a:["Maputo","Beira","Nacala"],correct:0},{q:"3x15?",a:["45","35","50"],correct:0},{q:"Earth shape?",a:["Round","Flat","Square"],correct:0},{q:"Time per Q?",a:["10s","20s","15s"],correct:0},{q:"9+11?",a:["20","19","21"],correct:0},{q:"Flag sun?",a:["Rising sun","Setting","No sun"],correct:0},{q:"18/2?",a:["9","8","10"],correct:0},{q:"Smallest country?",a:["Vatican","Malawi","Lesotho"],correct:0},{q:"1000/10?",a:["100","90","110"],correct:0},{q:"Time stops?",a:["Yes","No","Sometimes"],correct:0},{q:"11x11?",a:["121","111","131"],correct:0},{q:"Blantyre old capital?",a:["Yes","No","Never"],correct:0},{q:"13+7?",a:["20","19","21"],correct:0},{q:"Internet?",a:["Network","Single","Phone"],correct:0},{q:"Airtel pay?",a:["0996504676","0885801081","099111"],correct:0},{q:"30-10?",a:["20","10","30"],correct:0},{q:"Zambia currency?",a:["Kwacha","Pula","Rand"],correct:0},{q:"5x5x2?",a:["50","25","30"],correct:0},{q:"Regions?",a:["3","4","5"],correct:0},{q:"60 sec?",a:["1 min","2 min","30 sec"],correct:0},{q:"14x2?",a:["28","24","26"],correct:0},{q:"Largest continent?",a:["Asia","Africa","Europe"],correct:0},{q:"Owner?",a:["Gift","John","Peter"],correct:0},{q:"40/4?",a:["10","8","12"],correct:0},{q:"Money Chichewa?",a:["Ndalama","Madzi","Nyumba"],correct:0},{q:"16/4?",a:["4","3","5"],correct:0},{q:"Shire from?",a:["Lake Malawi","Chilwa","No"],correct:0},{q:"3x3x3?",a:["27","9","18"],correct:0},{q:"Week days?",a:["7","5","6"],correct:0},{q:"After 3 days?",a:["Deactivated","Active","Deleted"],correct:0},{q:"90/9?",a:["10","9","11"],correct:0},{q:"Tanzania neighbor?",a:["Yes","No","Far"],correct:0},{q:"20x3?",a:["60","50","70"],correct:0},{q:"WhatsApp?",a:["Follow channel","Not needed","Pay only"],correct:0},{q:"100+200?",a:["300","250","400"],correct:0},{q:"Capital Tanzania?",a:["Dodoma","Dar","Arusha"],correct:0},{q:"7+8?",a:["15","14","16"],correct:0},{q:"Chilwa district?",a:["Zomba","Mzimba","Karonga"],correct:0},{q:"80/8?",a:["10","8","12"],correct:0},{q:"First president?",a:["Kamuzu","Chakwera","Muluzi"],correct:0},{q:"6+9?",a:["15","14","16"],correct:0},{q:"M1 road?",a:["North-South","East-West","Circle"],correct:0},{q:"33+33?",a:["66","60","70"],correct:0},{q:"Airtel Money code?",a:["*211#","#211*","211"],correct:0},{q:"45/5?",a:["9","8","10"],correct:0},{q:"Tea where?",a:["Thyolo","Lilongwe","Karonga"],correct:0},{q:"12x5?",a:["60","50","70"],correct:0},{q:"Leaderboard?",a:["Live","Fake","Off"],correct:0},{q:"18+12?",a:["30","28","32"],correct:0},{q:"Mzuzu region?",a:["North","South","Centre"],correct:0},{q:"70/7?",a:["10","7","11"],correct:0},{q:"Airtel color?",a:["Red","Blue","Green"],correct:0},{q:"99+1?",a:["100","99","101"],correct:0},{q:"Time stops how?",a:["Yes tap NEXT","No","Auto"],correct:0},{q:"Lilongwe river?",a:["Lilongwe River","Shire","Rukuru"],correct:0},{q:"11+9?",a:["20","19","21"],correct:0},{q:"Population ~?",a:["20M","5M","100M"],correct:0},{q:"2x50?",a:["100","90","110"],correct:0},{q:"After answer tap?",a:["NEXT","Back","Pay"],correct:0}];
let currentQ=0,pts=0,cash=0,timeLeft=10,qTimer=null,canNext=false,tapCount=0;
function activateUser(p){let u=JSON.parse(localStorage.getItem('cashnet_users')||'{}');u[p]={active:true,startTime:Date.now(),expiryTime:Date.now()+(3*24*60*60*1000)};localStorage.setItem('cashnet_users',JSON.stringify(u));alert(p+' Active 3 days');loadLeaderboard();showAllUsers();}
function checkExpiry(p){let u=JSON.parse(localStorage.getItem('cashnet_users')||'{}')[p];if(!u||!u.active){showPay();return false;}if(Date.now()>u.expiryTime){let all=JSON.parse(localStorage.getItem('cashnet_users')||'{}');all[p].active=false;localStorage.setItem('cashnet_users',JSON.stringify(all));alert('⏰ Expired! Pay MK500 again');showPay();return false;}let d=Math.ceil((u.expiryTime-Date.now())/(1000*60*60*24));document.getElementById('daysLeft').innerText='Expires in '+d+' days';return true;}
function showPay(){document.getElementById('quizBox').style.display='none';document.getElementById('payBox').style.display='block';}
function login(){let ph=document.getElementById('phoneInput').value.trim();if(ph.length<9){alert('Enter phone');return;}localStorage.setItem('myPhone',ph);if(checkExpiry(ph)){document.getElementById('loginBox').style.display='none';document.getElementById('payBox').style.display='none';document.getElementById('quizBox').style.display='block';currentQ=0;pts=0;cash=0;showQuestion();}else{document.getElementById('loginBox').style.display='none';}}
function showQuestion(){if(currentQ>=questions.length){endQuiz();return;}timeLeft=10;canNext=false;document.getElementById('nextBtn').style.display='none';document.getElementById('qText').innerText=questions[currentQ].q;document.getElementById('qNum').innerText=currentQ+1;let ad=document.getElementById('answers');ad.innerHTML='';questions[currentQ].a.forEach((o,i)=>{let d=document.createElement('div');d.className='ans';d.innerText=o;d.onclick=()=>checkAnswer(i);ad.appendChild(d);});startQTimer();}
function startQTimer(){clearInterval(qTimer);document.getElementById('timer').innerText=timeLeft+'s';qTimer=setInterval(()=>{timeLeft--;document.getElementById('timer').innerText=timeLeft+'s';if(timeLeft<=0){clearInterval(qTimer);document.getElementById('nextBtn').style.display='block';canNext=true;}},1000);}
function stopQTimer(){clearInterval(qTimer);}
function checkAnswer(i){stopQTimer();if(i==questions[currentQ].correct){pts+=10;cash+=10;}document.getElementById('pts').innerText=pts;document.getElementById('cash').innerText=cash;canNext=true;document.getElementById('nextBtn').style.display='block';}
function nextQuestion(){if(!canNext)return;currentQ++;showQuestion();}
function endQuiz(){alert('Done! '+pts+'pts MK'+cash);saveScore();currentQ=0;pts=0;cash=0;document.getElementById('pts').innerText=0;document.getElementById('cash').innerText=0;showQuestion();}
function saveScore(){let ph=localStorage.getItem('myPhone');let b=JSON.parse(localStorage.getItem('leaderboard')||'[]');b=b.filter(u=>u.phone!=ph);b.push({phone:ph,pts:pts,cash:cash});b.sort((a,b)=>b.pts-a.pts);localStorage.setItem('leaderboard',JSON.stringify(b));loadLeaderboard();}
function loadLeaderboard(){let b=JSON.parse(localStorage.getItem('leaderboard')||'[]');b.sort((a,b)=>b.pts-a.pts);let h='';b.slice(0,15).forEach((u,i)=>{h+=`<div class="lead-row"><span>#${i+1} ${u.phone}</span><span>${u.pts}pts MK${u.cash}</span></div>`});document.getElementById('leaderboardList').innerHTML=h||'No scores yet';}
function showAllUsers(){let u=JSON.parse(localStorage.getItem('cashnet_users')||'{}');let h='<h4>Users:</h4>';for(let p in u){let act=u[p].active&&Date.now()<u[p].expiryTime;h+=`<div>${p} - ${act?'✅':'❌'}</div>`;}document.getElementById('allUsers').innerHTML=h;}
loadLeaderboard();
document.getElementById('logoTap').addEventListener('click',()=>{tapCount++;if(tapCount>=5){let pin=prompt('Admin PIN:');if(pin=='0885801081'){document.getElementById('adminBox').style.display='block';showAllUsers();alert('Admin OK');}tapCount=0;}setTimeout(()=>tapCount=0,3000);});
function adminActivate(){let p=document.getElementById('adminPhone').value.trim();if(p)activateUser(p);}
function adminDeactivate(){let p=document.getElementById('adminPhone').value.trim();let u=JSON.parse(localStorage.getItem('cashnet_users')||'{}');if(u[p]){u[p].active=false;localStorage.setItem('cashnet_users',JSON.stringify(u));alert('Deactivated');showAllUsers();}}
let myPhone=localStorage.getItem('myPhone');if(myPhone){document.getElementById('phoneInput').value=myPhone;if(checkExpiry(myPhone)){document.getElementById('loginBox').style.display='none';document.getElementById('quizBox').style.display='block';showQuestion();}}
</script></body></html>
