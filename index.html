<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASH-NET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:#fff;text-align:center;padding:10px}
.card{background:#1e293b;padding:14px;border-radius:14px;margin:10px auto;max-width:420px}
.btn{padding:13px;border:none;border-radius:10px;font-weight:bold;width:95%;margin:6px 0;cursor:pointer;font-size:16px}
.btn-gold{background:#fbbf24;color:#000}
.btn-green{background:#25D366;color:#fff}
.btn-dark{background:#334155;color:#fff}
input{padding:14px;border-radius:10px;width:95%;margin:6px;background:#000;color:#fff;border:1px solid #555;font-size:16px}
#timer{font-size:42px;font-weight:900;color:#fbbf24}
#wheel{width:190px;height:190px;border-radius:50%;border:8px solid #fbbf24;margin:15px auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(#f59e0b 0 60deg,#22c55e 60deg 120deg,#ef4444 120deg 180deg,#3b82f6 180deg 240deg,#a855f7 240deg 300deg,#fbbf24 300deg 360deg);transition:transform 3s}
.tabs{display:flex;gap:5px}
.tab{flex:1;padding:10px;border-radius:8px;background:#334155;color:#fff;border:none;font-weight:bold}
.tab.active{background:#fbbf24;color:#000}
#logo{cursor:pointer;padding:15px;background:#1e293b;border-radius:12px;max-width:420px;margin:10px auto;border:2px solid #fbbf24;user-select:none}
</style>
</head>
<body>
<h1 id="logo">💰 CASH-NET<br><small style="font-size:10px;color:#aaa">Tap 5x for Admin</small></h1>

<div class="card" id="loginBox" style="display:block">
<h3>Enter Phone to Login</h3>
<input id="phoneInput" type="tel" placeholder="0985675470">
<button class="btn btn-gold" id="loginBtn">LOGIN NOW</button>
</div>

<div id="mainArea" style="display:none;max-width:420px;margin:auto">
<div class="card" style="border:2px solid #fbbf24">
<h3>💼 WALLET: MK <span id="walletBal">0</span></h3>
<p>Points: <span id="pts">0</span></p>
<p id="statusTxt"></p>
<button class="btn btn-green" onclick="withdrawWA()">💸 Withdraw</button>
<button class="btn btn-dark" onclick="convertPts()">Convert Points</button>
</div>
<div class="tabs"><button class="tab active" onclick="showTab('quiz',this)">Quiz</button><button class="tab" onclick="showTab('spin',this)">Spin</button><button class="tab" onclick="showTab('more',this)">More</button></div>
<div class="card" id="tab-quiz"><div id="timer">10</div><h3 id="qText"></h3><div id="qOpts"></div><p id="qRes" style="font-weight:bold"></p></div>
<div class="card" id="tab-spin" style="display:none"><div id="wheel">🎯</div><p id="spinRes"></p><button class="btn btn-gold" onclick="spin()">SPIN (20pts)</button><p id="freeSpinTxt"></p></div>
<div class="card" id="tab-more" style="display:none"><button class="btn btn-gold" onclick="shareWA()">📤 Share (+20)</button><button class="btn btn-green" onclick="inviteWA()">👥 Invite (+50)</button><button class="btn btn-dark" onclick="payWA()">💰 Renew</button><p style="font-size:10px;word-break:break-all">Link: <span id="myLink"></span></p></div>
</div>

<div class="card" id="payBox" style="display:none"><h3>🔒 Expired - Pay MK500</h3><p>Airtel 0985675470<br>TNM 0885801081</p><button class="btn btn-green" onclick="payWA()">WhatsApp Proof</button></div>
<div class="card" id="adminBox" style="display:none"><h3 style="color:#ef4444">👑 ADMIN</h3><input id="adminPhone" placeholder="Phone"><button class="btn btn-green" onclick="adminAct()">Activate 3 Days</button><button class="btn btn-dark" onclick="renderUsers()">Refresh</button><div id="userList"></div></div>

<script>
let users=JSON.parse(localStorage.getItem('cashnet_users')||'{}');
let cur=localStorage.getItem('cashnet_current')||'';
let siteLink=location.origin+location.pathname;
let questions=[
{q:"Capital of Malawi?",o:["Lilongwe","Blantyre"],a:0},
{q:"2+2?",o:["4","3"],a:0},
{q:"10x5?",o:["50","40"],a:0},
{q:"1GB=?MB",o:["1024","1000"],a:0},
{q:"CASH-NET fee?",o:["MK500","MK1000"],a:0},
{q:"TNM code?",o:["*444#","*211#"],a:0},
{q:"Airtel code?",o:["*211#","*444#"],a:0},
{q:"28 districts?",o:["28","30"],a:0},
{q:"100-50?",o:["50","100"],a:0},
{q:"9x9?",o:["81","72"],a:0}
];
let qIndex=0,tInt=null,freeSpin=1,answered=false;

function loginNow(){
 let ph=document.getElementById('phoneInput').value.trim();
 if(!ph||ph.length<9){alert('Enter phone');return;}
 cur=ph; localStorage.setItem('cashnet_current',ph);
 if(!users[ph]) users[ph]={pts:50,balance:0,active:false,expiry:0};
 if(ph==='0885801081'){users[ph].active=true;users[ph].expiry=Date.now()+7*24*60*60*1000;}
 localStorage.setItem('cashnet_users',JSON.stringify(users));
 check();
}
document.getElementById('loginBtn').addEventListener('click',loginNow);

let urlP=new URLSearchParams(location.search);
if(urlP.has('admin')){setTimeout(()=>{document.getElementById('adminBox').style.display='block';renderUsers();},500);}
let ap=urlP.get('activate'); if(ap){if(!users[ap])users[ap]={pts:50,balance:0};users[ap].active=true;users[ap].expiry=Date.now()+3*24*60*60*1000;localStorage.setItem('cashnet_users',JSON.stringify(users));localStorage.setItem('cashnet_current',ap);alert(ap+' Activated');history.replaceState({},'',location.pathname);}
let ref=urlP.get('ref'); if(ref){if(!users[ref])users[ref]={pts:50,balance:0};users[ref].pts+=50;localStorage.setItem('cashnet_users',JSON.stringify(users));}

function check(){
 if(!cur){document.getElementById('loginBox').style.display='block';return;}
 document.getElementById('loginBox').style.display='none';
 let u=users[cur]; let ok=u.active&&u.expiry>Date.now()||cur==='0885801081';
 if(ok){document.getElementById('mainArea').style.display='block'; updateUI(); startQ();}
 else{document.getElementById('payBox').style.display='block';}
}
function updateUI(){let u=users[cur]; document.getElementById('pts').innerText=u.pts||0; document.getElementById('walletBal').innerText=u.balance||0; document.getElementById('myLink').innerText=siteLink+'?ref='+cur; document.getElementById('statusTxt').innerText='Active till '+new Date(u.expiry).toLocaleDateString(); document.getElementById('freeSpinTxt').innerText=freeSpin+' free left';}
function showTab(t,el){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); if(el) el.classList.add('active'); document.getElementById('tab-quiz').style.display=t==='quiz'?'block':'none'; document.getElementById('tab-spin').style.display=t==='spin'?'block':'none'; document.getElementById('tab-more').style.display=t==='more'?'block':'none';}
function startQ(){qIndex=0; showQ();}

function showQ(){
 if(qIndex>=questions.length) qIndex=0;
 answered=false;
 let qq=questions[qIndex];
 document.getElementById('qText').innerText=(qIndex+1)+'. '+qq.q;
 document.getElementById('qRes').innerText='';
 let o=document.getElementById('qOpts'); o.innerHTML='';
 qq.o.forEach((op,i)=>{
  let b=document.createElement('button');
  b.className='btn btn-dark';
  b.innerText=op;
  b.disabled=false;
  b.onclick=()=>{if(!answered) ans(i);};
  o.appendChild(b);
 });
 let timeLeft=10;
 document.getElementById('timer').innerText=timeLeft;
 clearInterval(tInt);
 tInt=setInterval(()=>{
  if(answered){clearInterval(tInt);return;}
  timeLeft--;
  document.getElementById('timer').innerText=timeLeft;
  if(timeLeft<=0){
   clearInterval(tInt);
   document.getElementById('qRes').innerText='⏰ Time up!';
   qIndex++;
   setTimeout(()=>{showQ();},1000);
  }
 },1000);
}

// FIXED: TIMER STOPS AFTER ANSWER
function ans(i){
 if(answered) return;
 answered=true;
 clearInterval(tInt);
 document.getElementById('timer').innerText='0';
 let qq=questions[qIndex];
 // disable all buttons
 document.querySelectorAll('#qOpts button').forEach(b=>b.disabled=true);
 if(i===qq.a){
  users[cur].pts+=10;
  document.getElementById('qRes').innerText='✅ Correct +10';
  document.getElementById('qRes').style.color='#22c55e';
 }else{
  document.getElementById('qRes').innerText='❌ Wrong';
  document.getElementById('qRes').style.color='#ef4444';
 }
 localStorage.setItem('cashnet_users',JSON.stringify(users));
 updateUI();
 qIndex++;
 setTimeout(()=>{showQ();},1200);
}

function spin(){let u=users[cur]; if(freeSpin<=0&&u.pts<20) return alert('Need 20pts'); if(freeSpin>0)freeSpin--; else u.pts-=20; let w=document.getElementById('wheel'); w.style.transform=`rotate(${360*5+Math.random()*360}deg)`; setTimeout(()=>{let pr=[0,10,20,50,100,500]; let p=pr[Math.floor(Math.random()*pr.length)]; if(p>0){u.balance+=p; document.getElementById('spinRes').innerText='Won MK'+p;}else{document.getElementById('spinRes').innerText='Try again';} localStorage.setItem('cashnet_users',JSON.stringify(users)); updateUI();},3000);}
function convertPts(){let u=users[cur]; if(u.pts<10) return alert('Need 10pts'); let mk=Math.floor(u.pts/10)*10; u.pts-=mk; u.balance+=mk; localStorage.setItem('cashnet_users
